# GitHub Labeler config - labels applied based on changed files in PRs to main
# v5 format: https://github.com/actions/labeler

documentation:
  - changed-files:
    - any-glob-to-any-file: ['**/*.md', '**/*.mdx', 'docs/**', '*.rst', '*.txt']

'config / ci':
  - changed-files:
    - any-glob-to-any-file: ['.github/**', '*.yml', '*.yaml', '.editorconfig', '.prettierrc*', '.eslintrc*', 'tsconfig*.json', 'package.json', 'Cargo.toml', 'pyproject.toml', 'Makefile']

dependencies:
  - changed-files:
    - any-glob-to-any-file: ['package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'requirements*.txt', 'Pipfile*', 'Cargo.lock', 'go.sum', 'poetry.lock']

source:
  - changed-files:
    - any-glob-to-any-file: ['src/**', 'lib/**', 'app/**', '**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.py', '**/*.go', '**/*.rs', '**/*.java', '**/*.kt']

tests:
  - changed-files:
    - any-glob-to-any-file: ['**/*.test.*', '**/*.spec.*', '**/__tests__/**', '**/test/**', '**/tests/**', '*.test.*', '*.spec.*']
